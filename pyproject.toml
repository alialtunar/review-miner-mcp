[project]
name = "review-miner-mcp"
version = "0.1.0"
description = "MCP server that mines App Store and Steam reviews so your AI can find what users hate about competitors. No API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ali Altunar" }]
keywords = ["mcp", "model-context-protocol", "app-store", "steam", "reviews", "market-research", "claude"]
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
review-miner-mcp = "review_miner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_miner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
